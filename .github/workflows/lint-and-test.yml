name: Lint and Test

on: pull_request

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      # Skip the Cypress binary download so a legacy (v5) install can't break `npm ci`.
      CYPRESS_INSTALL_BINARY: 0

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Jest suite predates the Vite migration + Node 20; non-blocking until upgraded.
      # TODO: upgrade Jest/testing setup and re-enable as a gate.
      - name: Test
        continue-on-error: true
        run: npm test

      - name: Build
        run: npm run build

      # Legacy Cypress (v5) — non-blocking smoke check until upgraded.
      - name: Test End-to-end
        continue-on-error: true
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run serve
          wait-on: 'http://localhost:8000'
